<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 - Conditional Logic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px auto;
      max-width: 600px;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    h2 { margin-bottom: 8px; color: #111; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #1565c0; }
    .output-box {
      margin-top: 20px;
      background: #212529;
      color: #f8f9fa;
      padding: 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Assignment 3: Conditional Logic Implementation</h2>
  <p class="sub">Evaluate scores with <code>if...else</code>, determine grades with <code>switch</code>, and status with ternary.</p>

  <div class="form-group">
    <label for="score">Numerical Test Score (0 - 100):</label>
    <input type="number" id="score" value="85" min="0" max="100" />
  </div>

  <button onclick="handleEvaluate()">Evaluate Score</button>

  <div class="output-box" id="result">Click 'Evaluate Score' to see the output.</div>

  <script src="script.js"></script>
  <script>
    function handleEvaluate() {
      const score = document.getElementById("score").value;
      const output = evaluateScore(score);
      document.getElementById("result").textContent = output;
    }
    window.addEventListener("DOMContentLoaded", handleEvaluate);
  </script>
</body>
</html>
