<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Loop Control Structures</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px auto;
      max-width: 600px;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    h2 { margin-bottom: 8px; color: #111; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #1565c0; }
    .output-box {
      margin-top: 20px;
      background: #212529;
      color: #f8f9fa;
      padding: 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Assignment 4: Loop Control Structures</h2>
  <p class="sub">Demonstrating <code>for</code> loop, <code>while</code> with <code>break</code>, and <code>do...while</code> with <code>continue</code>.</p>

  <div class="form-group">
    <label for="tableNum">Multiplication Table Base Number:</label>
    <input type="number" id="tableNum" value="5" min="1" />
  </div>

  <button onclick="handleRunLoops()">Run Loops</button>

  <div class="output-box" id="result">Click 'Run Loops' to see the output.</div>

  <script src="script.js"></script>
  <script>
    function handleRunLoops() {
      const num = document.getElementById("tableNum").value;
      const output = runLoopStructures(num);
      document.getElementById("result").textContent = output;
    }
    window.addEventListener("DOMContentLoaded", handleRunLoops);
  </script>
</body>
</html>
