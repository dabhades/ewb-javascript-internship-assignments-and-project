<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 1 - Variables & Data Types</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px auto;
      max-width: 600px;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    h2 { margin-bottom: 8px; color: #111; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #1565c0; }
    .output-box {
      margin-top: 20px;
      background: #212529;
      color: #f8f9fa;
      padding: 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Assignment 1: Variables, Data Types & Console Operations</h2>
  <p class="sub">Interact with variables and view their types checked using <code>typeof</code>.</p>

  <div class="form-group">
    <label for="name">Name:</label>
    <input type="text" id="name" value="Alice" />
  </div>

  <div class="form-group">
    <label for="age">Age:</label>
    <input type="number" id="age" value="25" />
  </div>

  <div class="form-group">
    <label for="employed">Is Employed:</label>
    <select id="employed">
      <option value="true" selected>true</option>
      <option value="false">false</option>
    </select>
  </div>

  <div class="form-group">
    <label for="skills">Skills (comma-separated):</label>
    <input type="text" id="skills" value="HTML, CSS, JavaScript" />
  </div>

  <button onclick="handleRun()">Display Variables</button>

  <div class="output-box" id="result">Click 'Display Variables' to see the output.</div>

  <script src="script.js"></script>
  <script>
    function handleRun() {
      const name = document.getElementById("name").value;
      const age = document.getElementById("age").value;
      const emp = document.getElementById("employed").value;
      const skills = document.getElementById("skills").value;

      const output = displayUserData(name, age, emp, skills);
      document.getElementById("result").textContent = output;
    }
    // initial display
    window.addEventListener("DOMContentLoaded", handleRun);
  </script>
</body>
</html>
