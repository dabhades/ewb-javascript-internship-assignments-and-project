<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capstone Mini Project - Product Inventory & Analytics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px auto;
      max-width: 700px;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    h2 { margin-bottom: 6px; color: #111; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .form-group {
      flex: 1;
      min-width: 180px;
    }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 4px;
    }
    button:hover { background: #1565c0; }
    .btn-secondary { background: #546e7a; }
    .btn-secondary:hover { background: #455a64; }
    .table-section {
      margin-top: 20px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
    }
    th { background: #f5f5f5; font-weight: bold; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-Premium { background: #e1bee7; color: #4a148c; }
    .badge-Standard { background: #bbdefb; color: #0d47a1; }
    .badge-Budget { background: #c8e6c9; color: #1b5e20; }
    .output-box {
      margin-top: 20px;
      background: #212529;
      color: #f8f9fa;
      padding: 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Interactive Product Inventory & Analytics Dashboard</h2>
  <p class="sub">Console-based Capstone Mini Project with Interactive UI.</p>

  <div class="form-row">
    <div class="form-group">
      <label for="prodName">New Product Name:</label>
      <input type="text" id="prodName" value="Monitor" placeholder="e.g. Monitor" />
    </div>
    <div class="form-group">
      <label for="prodPrice">Price in ₹:</label>
      <input type="number" id="prodPrice" value="150" min="1" placeholder="e.g. 150" />
    </div>
  </div>

  <div>
    <button onclick="handleAddProduct()">Add to Inventory & Process</button>
    <button class="btn-secondary" onclick="handlePromptAdd()">Run with prompt()</button>
  </div>

  <div class="table-section">
    <strong>Current Inventory Items:</strong>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Product Name</th>
          <th>Price</th>
          <th>Category Badge</th>
        </tr>
      </thead>
      <tbody id="inventoryList">
        <!-- Rendered by JS -->
      </tbody>
    </table>
  </div>

  <div class="output-box" id="consoleOutput">Terminal output will be shown here...</div>

  <script src="app.js"></script>
  <script>
    function refreshTable() {
      const tbody = document.getElementById("inventoryList");
      tbody.innerHTML = "";
      inventory.forEach((item, idx) => {
        const cat = getCategoryBadge(item.price);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${idx + 1}</td>
          <td>${item.name}</td>
          <td>₹${item.price}</td>
          <td><span class="badge badge-${cat}">${cat}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    function handleAddProduct() {
      const name = document.getElementById("prodName").value;
      const price = document.getElementById("prodPrice").value;

      const output = processInventoryAnalytics(name, price);
      document.getElementById("consoleOutput").textContent = output;
      refreshTable();
    }

    function handlePromptAdd() {
      const name = prompt("Enter product name:", "Monitor");
      const price = prompt("Enter product price in ₹:", "150");
      if (name && price) {
        document.getElementById("prodName").value = name;
        document.getElementById("prodPrice").value = price;
        const output = processInventoryAnalytics(name, price);
        document.getElementById("consoleOutput").textContent = output;
        refreshTable();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      // initial execution using default Monitor at ₹150
      handleAddProduct();
    });
  </script>
</body>
</html>
